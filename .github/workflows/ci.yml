# ============================================================
# CI 门禁 —— 代码审查标准 §6.1 L3 层
#
# 设计原则：
#  1. 只跑「已存在」的检查，保证 CI 从一开始就是绿的、可信的；
#  2. lint / test 用 `--if-present` 接线：脚本尚未接入时自动跳过，
#      一旦 package.json 里加上 lint/test，门禁**自动生效**，无需改 CI；
#  3. 机械性检查（行尾、密钥、构建产物）不占用人工审查带宽。
#
# 任一 job 失败 → 阻断合入（对应标准 §4.2 准出条件）。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧的运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 仓库卫生：机械性检查（标准 §3.E4 / §3.B5 / §3.E）
  # ─────────────────────────────────────────────
  hygiene:
    name: 仓库卫生（行尾 / 密钥 / 构建产物）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 shell 脚本行尾必须为 LF
        run: |
          set -euo pipefail
          bad=$(grep -rlU $'\r' --include='*.sh' --exclude-dir=node_modules . || true)
          if [ -n "$bad" ]; then
            echo "::error::以下 shell 脚本含 CRLF 行尾，Linux 容器内会报 \$'\\r': command not found"
            echo "$bad"
            exit 1
          fi
          echo "✅ shell 脚本行尾均为 LF"

      - name: 检查 Dockerfile / compose / nginx 行尾必须为 LF
        run: |
          set -euo pipefail
          files=$(find . -path ./node_modules -prune -o \
            \( -name 'Dockerfile' -o -name 'docker-compose.yml' -o -name '*.conf' \) -print)
          bad=""
          for f in $files; do
            if grep -qU $'\r' "$f" 2>/dev/null; then bad="$bad$f\n"; fi
          done
          if [ -n "$bad" ]; then
            echo "::error::以下文件含 CRLF 行尾，容器内执行会失败"
            printf "$bad"
            exit 1
          fi
          echo "✅ 容器相关文件行尾均为 LF"

      - name: 检查真实密钥文件未入库（标准 §3.B5）
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "::error::.env 不应入库（应只提交 .env.example）"
            exit 1
          fi
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::检测到被跟踪的环境变量文件："
            echo "$tracked"
            exit 1
          fi
          echo "✅ 未发现入库的真实密钥文件"

      - name: 检查构建产物与依赖未入库
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)node_modules/|(^|/)dist/|\.tsbuildinfo$' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下构建产物不应入库："
            echo "$bad"
            exit 1
          fi
          echo "✅ 未发现入库的构建产物"

  # ─────────────────────────────────────────────
  # 后端：类型检查 + 构建 + Prisma 校验
  # ─────────────────────────────────────────────
  backend:
    name: 后端（Prisma 校验 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci 会在 package.json 与 lockfile 不同步时直接失败
      # —— 这正是标准 §3.E6 / 反模式 AP-04 的自动拦截
      - name: 安装依赖（同时校验 lockfile 同步）
        run: npm ci --no-audit --no-fund

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 校验 Prisma schema
        run: npx prisma validate

      - name: 构建
        run: npm run build

      # 接线但暂未接入：脚本存在后自动生效
      - name: Lint（若已接入）
        run: npm run lint --if-present

      - name: 测试（若已接入）
        run: npm run test --if-present

  # ─────────────────────────────────────────────
  # 前端：类型检查 + 构建
  # ─────────────────────────────────────────────
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（同时校验 lockfile 同步）
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: Lint（若已接入）
        run: npm run lint --if-present

      - name: 测试（若已接入）
        run: npm run test --if-present

  # ─────────────────────────────────────────────
  # 迁移可执行性：在真实空库上跑一遍（标准 §3.C6）
  # ─────────────────────────────────────────────
  migrations:
    name: 迁移可回放性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: 在空库上执行迁移
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app:app_password@localhost:5432/migration_check?schema=public
        run: npx prisma migrate deploy

      - name: 校验领域 CHECK 约束确实存在
        env:
          PGPASSWORD: app_password
        run: |
          set -euo pipefail
          # 迁移是手写 SQL，必须确认关键约束真的建上了（标准 §3.C6）
          for c in \
            requirement_state_chk \
            requirement_proposer_ne_assignee_chk \
            review_return_reason_chk \
            submission_artifact_url_chk
          do
            found=$(docker run --rm --network host -e PGPASSWORD=app_password postgres:16-alpine \
              psql -h localhost -U app -d migration_check -tAc \
              "SELECT count(*) FROM pg_constraint WHERE conname='$c';" 2>/dev/null || echo "0")
            if [ "$found" != "1" ]; then
              echo "::error::约束 $c 未创建成功"
              exit 1
            fi
            echo "✅ $c"
          done

  # ─────────────────────────────────────────────
  # Compose 配置合法性
  # ─────────────────────────────────────────────
  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 docker-compose.yml 语法与变量插值
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config > /dev/null
          echo "✅ docker-compose.yml 合法"
          rm -f .env
