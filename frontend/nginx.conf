server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 基础安全响应头（内网 http 部署，故不启用 HSTS）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的静态资源可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反向代理：同源访问，会话 Cookie 自然携带
    #
    # 这里用「resolver + 变量式 proxy_pass」，而不是静态的 `proxy_pass http://api:3000`。
    # 原因：nginx 只在**启动时**解析一次上游域名并永久缓存。于是
    #   · `docker compose up --scale api=2` 之后，新副本的 IP 永远不会被使用；
    #   · 缩容之后，nginx 会继续把请求发往已经消失的 IP，返回 502。
    # 改成变量式后，nginx 会在 TTL 到期（10s）后重新解析，副本增减即可生效。
    #
    # 关于 URI：nginx 文档规定「proxy_pass 中使用变量时，若指令中写了 URI，
    # 该 URI 会**原样**替换原始请求 URI」。所以这里显式拼上 $request_uri，
    # 保证 /api/xxx 原封不动地转给后端 —— 与原先静态写法的行为完全一致。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内置 DNS
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # SPA 路由回退：/requirements/xxx 之类的前端路由交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
