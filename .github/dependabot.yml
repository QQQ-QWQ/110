# ============================================================
# Dependabot 配置（报告 §6.5 P3）
#
# 为什么需要它：CI 里的 `scripts/check-audit.mjs` 只能**拦住**高危漏洞，
# 它不会主动把依赖升上去。没有 Dependabot 的话，`npm audit` 里的 moderate
# 会一直躺在那里，直到有人想起来手动升级 —— 而「想不起来」是常态。
#
# 设计取舍：
#   · **每周一次**，不是每天：小项目每天开 PR 会淹没人（也会消耗 Actions 额度）。
#   · **分组**：把 minor/patch 合成一个 PR。逐个依赖开 PR 会让 5 个 PR 同时躺着，
#     而它们每个都要重跑一遍 CI。
#   · **major 不自动升**：单独成 PR 且需要人工评估 ——
#     本仓库就有先例：`prisma` 的大版本会改动迁移语义（见 check-audit.mjs 的豁免说明）。
# ============================================================

version: 2

updates:
  # ---------- 后端依赖 ----------
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
    groups:
      # NestJS 各包必须**同主版本一起升**。反例已经发生过：Dependabot 的
      # 第一个 PR 把 `@nestjs/common` 单独升到 12.x，而 `@nestjs/core` 还在 11.x、
      # `@nestjs/config` 的 peer 仍写着 `@nestjs/common ^10 || ^11` ——
      # `npm ci` 直接 ERESOLVE 失败（已在本地复现）。CI 判得对，是分组配置有缺陷。
      nestjs:
        patterns: ['@nestjs/*']
      # minor / patch 合成一个 PR（major 会被排除，单独开）
      minor-and-patch:
        patterns: ['*']
        exclude-patterns: ['@nestjs/*']
        update-types: ['minor', 'patch']
    ignore:
      # Prisma 大版本会改动迁移语义与生成的 Client，必须人工评估后手动升。
      # 本仓库还依赖它精确锁定的传递依赖（见 scripts/check-audit.mjs 的豁免说明）。
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # NestJS 大版本同理，而且更严格：框架主版本要等**整个生态**（@nestjs/config
      # 等）都跟上才能升 —— 那不是自动 PR 能决定的事。上面已把 @nestjs/* 分成一组，
      # 这里再挡住 major，确保「半升级」不会以自动 PR 的形式出现。
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # TypeScript 7 跨两个大版本，且**前后端的 typescript 版本必须一致**
      # （否则类型声明互相打架）。PR #14 实测三处红（后端构建 / 迁移可回放 / 端到端）。
      # 要升就前后端一起升并完整回归。
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # ---------- 前端依赖 ----------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
    groups:
      # lint 工具链必须**整套一起升**。反例已经真实发生过：Dependabot 把 eslint 单独
      # 升到 10，而 typescript-eslint@8 的 peer 是 `eslint: ^8.57.0 || ^9.0.0` ——
      # **不支持 eslint 10**，类型感知的规则集加载不了，CI 必然红（PR #2 因此被关闭）。
      # 单独升其中任何一个（eslint / @eslint/js / typescript-eslint / eslint-plugin-vue /
      # vue-eslint-parser / eslint-config-prettier / globals）都会遇到同类问题。
      # 另一个真实例子：eslint-plugin-vue@10 要求 `vue-eslint-parser ^10.3.0`，
      # 所以它必须与 vue-eslint-parser 一起升 —— 这正是 PR #4 一开始红、等 PR #5
      # 合入后才变绿的原因。
      lint-toolchain:
        patterns:
          - eslint
          - '@eslint/js'
          - typescript-eslint
          - eslint-plugin-vue
          - vue-eslint-parser
          - eslint-config-prettier
          - globals
      # 其余依赖：minor / patch 合成一个 PR（major 会被排除，单独开）
      minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - eslint
          - '@eslint/js'
          - typescript-eslint
          - eslint-plugin-vue
          - vue-eslint-parser
          - eslint-config-prettier
          - globals
        update-types: ['minor', 'patch']
    ignore:
      # vitest 4 → 5 是破坏性升级（已知的 moderate 漏洞需要它才能修），
      # 由人决定何时随测试框架一起升，而不是被自动 PR 推着走。
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # Vite 6 → 8 跨两个大版本，会改构建管线与插件 API。它与 @vitejs/plugin-vue、
      # vitest 必须**成套升级** —— 单独升 vite 必然失败（PR #19 已实测）。
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # vue-router 是应用骨架（3 个页面 + 登录跳转都依赖它），大版本会改 API 与
      # 导航守卫行为，必须人工评估 + 完整回归（PR #15 已实测红）。
      - dependency-name: vue-router
        update-types: ['version-update:semver-major']
      # TypeScript 7 有明确破坏性变更，且**前后端的 typescript 版本必须一致**
      # （否则类型声明互相打架）—— 两个 PR（#21 / #14）都因此失败。
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # ---------- GitHub Actions ----------
  # action 版本过期是供应链风险的常见入口（旧版本可能已被弃用或存在已知问题）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ['*']
