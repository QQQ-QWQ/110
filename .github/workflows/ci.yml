# ============================================================
# CI 门禁 —— 代码审查标准 §6.1 L3 层
#
# 设计原则：
#  1. 只跑「已存在」的检查，保证 CI 从一开始就是绿的、可信的；
#  2. lint / test 用 `--if-present` 接线：脚本尚未接入时自动跳过，
#      一旦 package.json 里加上 lint/test，门禁**自动生效**，无需改 CI；
#  3. 机械性检查（行尾、密钥、构建产物）不占用人工审查带宽。
#
# 任一 job 失败 → 阻断合入（对应标准 §4.2 准出条件）。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧的运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 仓库卫生：机械性检查（标准 §3.E4 / §3.B5 / §3.E）
  #
  # 这里**不**重新实现检查逻辑，而是直接调用 `scripts/preflight.mjs`。
  # 本地开发者跑的是同一个脚本（只是额外含工具层的 Prisma 格式 / Prettier）。
  # 于是「本地 preflight 绿」与「CI hygiene 绿」是同一件事 ——
  # 不会出现两套各自漂移的检查，也不会出现「本地过了 CI 不过」。
  #
  # 代价：这些检查在 CI 里合并成了一个步骤，粒度不如从前。
  # 但这正是该脚本存在的意义：拿不到 CI 日志时，本地跑一遍就能定位。
  # ─────────────────────────────────────────────
  hygiene:
    name: 仓库卫生（行尾 / 密钥 / 构建产物 / lockfile）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # preflight.mjs 是纯 Node 脚本（零运行时依赖），不需要 npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行仓库卫生检查（scripts/preflight.mjs --mechanical）
        run: node scripts/preflight.mjs --mechanical

  # ─────────────────────────────────────────────
  # 后端：类型检查 + 构建 + Prisma 校验
  # ─────────────────────────────────────────────
  backend:
    name: 后端（Prisma 校验 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # `prisma validate` / `prisma format` 都会解析 datasource 块，
    # 缺少 DATABASE_URL 会直接以 P1012 失败（与代码正确性无关）。
    # 此处给一个不建立连接的占位串，仅用于让 schema 解析通过。
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci 会在 package.json 与 lockfile 不同步时直接失败
      # —— 这正是标准 §3.E6 / 反模式 AP-04 的自动拦截
      - name: 安装依赖（同时校验 lockfile 同步）
        run: npm ci --no-audit --no-fund

      # 顺序刻意「先校验、后生成」：校验只需解析 schema（毫秒级），
      # 生成需要下载 query engine（十秒级）。schema 有错时应当快速失败，
      # 而不是先花十几秒下载引擎再报同一个错。
      - name: 校验 Prisma schema（语法 + 语义）
        run: npx prisma validate

      # Prisma 的 schema 解析器**不支持属性参数跨行**：
      #   currentSubmission Submission? @relation(   ← 换行即 P1012
      #     "CurrentSubmission", ...
      #   )
      # 手写 schema 极易踩到，而一旦踩到，generate / migrate deploy 会同时
      # 失败（CI 上表现为两个 job 一起红，但根因只有一个）。
      # `prisma format` 会把 schema 规范成官方唯一形态，此处用 git diff 断言
      # 「已规范」—— 任何未格式化的手写改动都会被拦住。
      - name: 检查 Prisma schema 已按官方格式规范化
        run: |
          set -euo pipefail
          npx prisma format
          if ! git diff --quiet -- prisma/schema.prisma; then
            echo "::error::prisma/schema.prisma 未按官方格式规范化。"
            echo "::error::请在本地执行 \`cd backend && npx prisma format\` 后提交。"
            git --no-pager diff -- prisma/schema.prisma
            exit 1
          fi
          echo "✅ Prisma schema 格式规范"

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 构建
        run: npm run build

      # 以下三项已接入；仍保留 --if-present，便于在新模块中逐步启用
      - name: 格式检查（Prettier）
        run: npm run format:check --if-present

      - name: 静态检查（ESLint）
        run: npm run lint --if-present

      - name: 单元测试
        run: npm run test --if-present

  # ─────────────────────────────────────────────
  # 前端：类型检查 + 构建
  # ─────────────────────────────────────────────
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（同时校验 lockfile 同步）
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 格式检查（Prettier）
        run: npm run format:check --if-present

      - name: 静态检查（ESLint）
        run: npm run lint --if-present

      - name: 单元测试
        run: npm run test --if-present

  # ─────────────────────────────────────────────
  # 迁移可执行性：在真实空库上跑一遍（标准 §3.C6）
  # ─────────────────────────────────────────────
  migrations:
    name: 迁移可回放性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # ── C2 迁移漂移检测 ────────────────────────────────────────────
      # 本仓库的迁移是**手写 SQL**（因为 Prisma schema 无法表达 15 条 CHECK
      # 约束），于是「prisma/schema.prisma」与「prisma/migrations/」构成两套
      # 真相。改了其中一套而忘记另一套，应用层与数据库层就会悄悄不一致 ——
      # 而这类不一致在单测、构建、迁移重放里都不会报错。
      #
      # 这是唯一能自动拦住它的检查。用 --exit-code 让退出码承载语义：
      #   0 = 一致；2 = 检测到漂移；其它 = 命令本身执行失败。
      # 必须区分「漂移」与「跑不起来」，否则会把环境问题误报成漂移。
      #
      # 本地已验证（便携版 PostgreSQL，见 docs/测试与验证记录.md）：
      #   无漂移 → 退出码 0，输出 "No difference detected."
      #   故意给 schema 加一个字段 → 退出码 2，输出 "[+] Added column ..."
      - name: 检测 Prisma schema 与迁移是否漂移（报告 §5.3 C2）
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app:app_password@localhost:5432/migration_check?schema=public
          SHADOW_DATABASE_URL: postgresql://app:app_password@localhost:5432/drift_shadow?schema=public
        run: |
          set -euo pipefail

          # migrate diff 需要一个**独立的 shadow 库**来重放全部迁移，
          # 不能复用业务库（会被重放过程破坏）。
          # 复用 postgres 官方镜像自带的 psql，避免在 runner 上安装
          # 与 service 镜像版本不一致的客户端。
          psql_q() {
            docker run --rm --network host \
              -e PGPASSWORD=app_password postgres:16-alpine \
              psql -h localhost -U app -d migration_check -tAc "$1"
          }

          if ! psql_q "SELECT 1;" >/dev/null 2>&1; then
            echo "::error::无法连接数据库，无法执行漂移检测（这属于 CI 环境问题，不是漂移）"
            exit 1
          fi

          psql_q "SELECT 1 FROM pg_database WHERE datname='drift_shadow'" | grep -q 1 \
            || psql_q "CREATE DATABASE drift_shadow" >/dev/null

          set +e
          out=$(npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code 2>&1)
          code=$?
          set -e

          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "✅ 迁移与 schema 一致，无漂移"
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::检测到漂移：prisma/schema.prisma 与 prisma/migrations/ 已不一致。"
            echo "::error::上方以 [+] / [-] / [*] 标出了差异；请补齐对应的迁移，或修正 schema。"
            exit 1
          fi
          echo "::error::prisma migrate diff 执行失败（退出码 $code，不是漂移，而是命令本身出错）"
          exit 1

      - name: 在空库上执行迁移
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app:app_password@localhost:5432/migration_check?schema=public
        run: npx prisma migrate deploy

      - name: 校验领域 CHECK 约束确实存在
        env:
          PGPASSWORD: app_password
        run: |
          set -euo pipefail
          # 迁移是手写 SQL（Prisma schema 无法表达 CHECK），
          # 因此必须独立确认关键约束真的建上了 —— 否则「迁移成功」可能只是
          # 建了空表，领域不变量会静默失守（标准 §3.C6）。
          #
          # 清单覆盖 0001_init 中全部手写 CHECK，而不只是状态机那几条：
          # 少验一条，就多一个「SQL 手滑但 CI 全绿」的盲区。
          constraints="
            app_user_account_not_blank_chk
            requirement_state_chk
            requirement_proposer_ne_assignee_chk
            requirement_row_version_chk
            requirement_title_not_blank_chk
            requirement_description_not_blank_chk
            criterion_seq_chk
            criterion_text_not_blank_chk
            submission_no_chk
            submission_artifact_seq_chk
            submission_artifact_url_chk
            review_action_chk
            review_return_reason_chk
            event_seq_chk
            idempotency_record_status_chk
          "

          # 复用 postgres 官方镜像自带的 psql，避免在 runner 上 apt 安装
          # 与 service 镜像版本不一致的客户端。
          query() {
            docker run --rm --network host \
              -e PGPASSWORD=app_password postgres:16-alpine \
              psql -h localhost -U app -d migration_check -tAc "$1"
          }

          # 先做一次连通性自检：把「连不上库」与「约束缺失」区分开，
          # 否则 psql 失败会被误报成「约束未创建成功」，把排查引向错误方向。
          if ! query "SELECT 1;" >/dev/null 2>&1; then
            echo "::error::无法连接 migration_check 数据库，无法执行约束校验（这属于 CI 环境问题，不是约束缺失）"
            exit 1
          fi

          failed=0
          for c in $constraints; do
            found=$(query "SELECT count(*) FROM pg_constraint WHERE conname='$c';" 2>/dev/null || echo "ERR")
            if [ "$found" = "1" ]; then
              echo "✅ $c"
            elif [ "$found" = "ERR" ]; then
              echo "::error::查询约束 $c 时 psql 执行失败"
              failed=1
            else
              echo "::error::约束 $c 未创建成功（实际匹配数：$found）"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "✅ 全部 15 条领域 CHECK 约束均已创建"

  # ─────────────────────────────────────────────
  # 端到端：起服务 + 跑 DEM-00 ~ DEM-08 与 DEM-11（架构报告 §5.3 C6）
  #
  # 为什么必须有这个 job：其余四个 job 全部只做「静态」检查 ——
  #   · 单测覆盖纯逻辑（状态机/权限/不变量），不碰 HTTP 与数据库；
  #   · 后端 job 只 build，不起服务；
  #   · migrations job 只校验「迁移能在空库跑通」与「约束存在」，
  #     **不校验种子能否写入**。
  #
  # 2026-10-05 的首次真实端到端实跑，立刻暴露了两个上述检查全都漏掉的缺陷：
  #   ① seed 循环外键写序错误 → P2003 → 因 entrypoint 的 set -e 放大为
  #      「api 容器起不来」，即「一键启动」交付要求实际不可用（P0）；
  #   ② 版本过期 412 被状态冲突 409 抢先，与文档和脚本均不一致（P1）。
  # 两者都只在服务真正跑起来时才暴露 —— 所以这一层不能省。
  #
  # 注意：本 job 用 postgres service + 直接运行编译产物，而不是
  # `docker compose up`。原因是前者可在本地逐条复现、失败时能定位；
  # 后者虽然还能顺带验证「一键启动」，但一旦在 CI 里失败，
  # 本环境拿不到 job 日志（公开仓库的 logs 接口也要求管理员权限），
  # 会陷入无法调试的循环。待本地 Docker 可用后再考虑追加。
  # ─────────────────────────────────────────────
  e2e:
    name: 端到端（起服务 + DEM-00~08 + DEM-11）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: demand_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d demand_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/demand_acceptance?schema=public
      SEED_PASSWORD: Passw0rd!
      PORT: '3100'
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # 显式 generate，不依赖 @prisma/client 的 postinstall 副作用：
      #   · `nest build` 会做类型检查，未生成的 Client 会让构建直接失败；
      #   · `node dist/seed.js` 运行期也需要真实的 Client。
      # 与 backend job 保持同一套命令，避免「两个 job 的构建方式不一致」。
      #
      # seed 失败会以退出码 1 结束；配合 set -e 直接打红本步骤。
      # 这一步本身就是「api 容器能否启动」的等价验证。
      - name: 生成 Client + 迁移 + 构建 + 写入种子数据
        working-directory: backend
        run: |
          set -euo pipefail
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          node dist/seed.js

      # 防御性断言：种子「退出码为 0」不等于「数据真的写全了」。
      # 这正是缺陷 ① 的回归守卫 —— 当时的表现就是第 3 条需求没写进去。
      - name: 校验种子数据完整（3 用户 / 3 需求 / 当前提交指针已回填）
        working-directory: backend
        run: |
          set -euo pipefail
          node -e 'const {PrismaClient}=require("@prisma/client");
          const p=new PrismaClient();
          (async()=>{
            const u=await p.user.count();
            const r=await p.requirement.count();
            const ir=await p.requirement.findFirst({where:{state:"IN_REVIEW"}});
            console.log("users="+u+" requirements="+r+" inReviewPointer="+(ir&&ir.currentSubmissionId));
            if(u!==3||r!==3){console.error("::error::种子数据不完整（期望 3 用户 / 3 需求）");process.exit(1);}
            if(!ir||!ir.currentSubmissionId){console.error("::error::待验收需求的 current_submission_id 未回填");process.exit(1);}
            await p.$disconnect();
          })().catch(e=>{console.error(e);process.exit(1);});'

      # S1 回归守卫：数据保留清理必须「只删该删的」。
      # 用真实数据库插入 5 类样本行（含「超过 100 小时仍是 PROCESSING」的记录），
      # 跑一次清理后断言「删除 / 保留」的边界。脚本自带清理，可重复执行。
      - name: 验证数据保留清理（S1）
        run: node scripts/verify-retention.mjs

      - name: 启动 API 并等待就绪
        working-directory: backend
        run: |
          set -euo pipefail
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "API 就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API 未在 40 秒内就绪"
          tail -50 /tmp/api.log
          exit 1

      - name: 端到端验证 DEM-00 ~ DEM-08 + DEM-11
        run: node scripts/e2e.mjs "http://127.0.0.1:${PORT}/api"

      - name: 失败时输出 API 日志（便于定位）
        if: failure()
        run: tail -100 /tmp/api.log || true

  # ─────────────────────────────────────────────
  # Compose 配置合法性
  # ─────────────────────────────────────────────
  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 校验 docker-compose.yml 语法与变量插值
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config > /dev/null
          echo "✅ docker-compose.yml 合法"
          rm -f .env
