# ============================================================
# 小团队需求与验收协作台 —— 一键启动
#
#   docker compose up --build
#
# 启动后访问： http://localhost:8080
# 首次启动自动完成：建库迁移 + 写入预置测试数据（幂等，可重复启动）
# 数据保存在命名卷 pgdata 中：删除容器后重建，业务数据依然存在
#
# 本文件**刻意不写 `container_name`**：
# 固定容器名会让 `docker compose up --scale api=2` 直接报
# "container name is already in use"，是横向扩展的硬阻塞。
# 去掉后容器名由 Compose 生成（如 <项目名>-api-1），而服务之间仍通过
# **服务名**（db / api）互访，因此 `depends_on` 与 nginx 的
# `proxy_pass http://api:3000` 都不受影响。
# ============================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-demand_acceptance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-demand_acceptance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      # 连接池与超时**显式声明**，取值依据见 .env.example「数据库连接池与语句超时」。
      #   · connection_limit / pool_timeout：Prisma 直接识别；
      #   · statement_timeout：Prisma 无对应参数，改由 libpq 的 `options` 参数
      #     下发给每一条新建连接（空格 → %20，等号 → %3D，必须 URL 编码）。
      # Prisma 默认 statement_timeout = 0（**不限**），一条病态查询即可长期占用
      # 连接；池耗尽后所有请求一起排队，故障从「一个接口慢」放大为「全站不可用」。
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-demand_acceptance}?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=${DB_POOL_TIMEOUT:-10}&options=-c%20statement_timeout%3D${DB_STATEMENT_TIMEOUT_MS:-10000}"
      PORT: "3000"
      # 预置测试账号的初始密码（仅初始化时使用，可用 .env 覆盖）
      SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!}
      # 内网 http 部署下保持 false，否则浏览器不会回传会话 Cookie
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_WAIT_MAX_TRIES: "60"
      DB_WAIT_INTERVAL: "2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        # 报告 §5.2 S3：不能只写 `- api`。
        # 简写形式只保证「容器已创建」，nginx 仍可能在 api 就绪前开始接收请求，
        # 于是首页可用但 /api 返回 502 —— 一个只在启动窗口出现、之后自愈的故障，
        # 排查时最容易归因到「网络问题」。
        # 用 service_healthy 把这段窗口消掉：api 的 HEALTHCHECK 定义在
        # backend/Dockerfile（node -e fetch 探测 /api/health/ready），
        # 所以它真的会去探数据库，而不只是「进程起来了」。
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: da-pgdata
